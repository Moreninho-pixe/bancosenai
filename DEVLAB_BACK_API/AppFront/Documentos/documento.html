<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Gestão de documentos - Banco Senai</title>
    <link rel="stylesheet" href="documento.css" />
</head>

<body>
    <h1>Gestão de Documentos</h1>

    <!-- Form de Upload -->
    <div class="form-container">
        <input type="number" id="codigoCliente" placeholder="Código do cliente" /><br />
        <input type="file" id="arquivo" />
        <button id="btnEnviar" onclick="enviarDocumento()">Enviar</button>
    </div>

    <hr />

    <!-- Área de Consulta (HU01) -->
    <div class="busca-container">
        <input type="number" id="buscaCodigoCliente" placeholder="Código do cliente para busca" />
        <button id="btnBuscar" onclick="buscarDocumentos()">Buscar Documentos</button>
    </div>

    <!-- Tabela de Documentos -->
    <table border="1" style="margin-top: 15px; width: 100%; border-collapse: collapse;">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nome</th>
                <th>Extensão</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaDocumentos">
            <!-- Linhas inseridas via JS -->
        </tbody>
    </table>

    <script src="documento.js"></script>
</body>
</html>
